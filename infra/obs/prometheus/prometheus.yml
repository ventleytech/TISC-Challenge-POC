# VoltPulse Prometheus — profile obs (P0-T404)
# shortcut: static targets on Compose network; upgrade to SD later

global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: vp_pulse_api
    metrics_path: /metrics
    static_configs:
      - targets: ["pulse-api:3000"]
        labels:
          plane: data
          service: pulse-api

  - job_name: vp_pulse_notify
    metrics_path: /metrics
    static_configs:
      - targets: ["pulse-notify:3010"]
        labels:
          plane: data
          service: pulse-notify

  - job_name: vp_pulse_gateway
    metrics_path: /metrics
    static_configs:
      - targets: ["pulse-gateway:3020"]
        labels:
          plane: media
          service: pulse-gateway

  - job_name: vp_grid_perception
    metrics_path: /metrics
    static_configs:
      - targets: ["grid-perception:8081"]
        labels:
          plane: sense
          service: grid-perception

  - job_name: vp_grid_rules
    metrics_path: /metrics
    static_configs:
      - targets: ["grid-rules:8080"]
        labels:
          plane: stream
          service: grid-rules
