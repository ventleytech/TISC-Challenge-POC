# VoltPulse Compose skeleton — project name voltpulse
# Profiles: sense | media | stream | data | obs | store
# Stub images except: store → MinIO (T110); stream/data bus → Apache Kafka KRaft (T210).

name: voltpulse

services:
  grid-perception:
    profiles: [sense]
    build:
      context: ../..
      dockerfile: apps/grid-perception/Dockerfile
    image: voltpulse/grid-perception:dev
    container_name: vp-grid-perception
    environment:
      PULSE_KAFKA_BOOTSTRAP: ${PULSE_KAFKA_BOOTSTRAP}
      PULSE_DETECT_TOPIC: ${PULSE_DETECT_TOPIC}
      GP_HEALTH_PORT: ${GP_HEALTH_PORT:-8081}
    restart: "no"

  pulse-gateway:
    profiles: [media]
    image: alpine:3.20
    container_name: vp-pulse-gateway
    command: ["sleep", "infinity"]
    ports:
      - "${PULSE_GATEWAY_RTSP_PORT:-8554}:8554"
    environment:
      PULSE_GATEWAY_RTSP_PORT: ${PULSE_GATEWAY_RTSP_PORT:-8554}
    restart: "no"

  # Apache Kafka (KRaft combined broker+controller). Profiles stream + data share the bus.
  pulse-bus:
    profiles: [stream, data]
    image: apache/kafka:4.1.0
    container_name: vp-pulse-bus
    hostname: pulse-bus
    ports:
      # In-compose clients use pulse-bus:9092; host clients use localhost:${PULSE_KAFKA_HOST_PORT}
      - "${PULSE_KAFKA_PORT:-9092}:9092"
      - "${PULSE_KAFKA_HOST_PORT:-9094}:9094"
    environment:
      CLUSTER_ID: ${PULSE_KAFKA_CLUSTER_ID}
      KAFKA_NODE_ID: ${PULSE_KAFKA_NODE_ID:-1}
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,PLAINTEXT_HOST://0.0.0.0:9094,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://pulse-bus:9092,PLAINTEXT_HOST://localhost:${PULSE_KAFKA_HOST_PORT:-9094}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: ${PULSE_KAFKA_NODE_ID:-1}@pulse-bus:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      # Surface VoltPulse bootstrap for dependent services / docs
      PULSE_KAFKA_BOOTSTRAP: ${PULSE_KAFKA_BOOTSTRAP}
    volumes:
      - pulse_kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 30s
    restart: "no"

  # Optional one-shot: create vp.* topics from contracts catalog (infra/kafka/create-topics.sh).
  pulse-kafka-topics:
    profiles: [stream, data]
    image: apache/kafka:4.1.0
    container_name: vp-pulse-kafka-topics
    working_dir: /work
    volumes:
      - ../..:/work:ro
    environment:
      PULSE_KAFKA_BOOTSTRAP: ${PULSE_KAFKA_BOOTSTRAP:-pulse-bus:9092}
      PULSE_TOPIC_CATALOG: /work/packages/contracts/events/catalog.yaml
      PULSE_TOPIC_PARTITIONS: ${PULSE_TOPIC_PARTITIONS:-1}
      PULSE_TOPIC_REPLICATION: ${PULSE_TOPIC_REPLICATION:-1}
      PATH: /opt/kafka/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        set -eu
        echo "waiting for pulse-bus…"
        i=0
        until /opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server "$$PULSE_KAFKA_BOOTSTRAP" >/dev/null 2>&1; do
          i=$$((i+1))
          if [ "$$i" -gt 30 ]; then
            echo "pulse-bus not ready after retries" >&2
            exit 1
          fi
          sleep 2
        done
        exec /bin/bash /work/infra/kafka/create-topics.sh
    depends_on:
      pulse-bus:
        condition: service_healthy
    restart: "no"

  grid-rules:
    profiles: [stream]
    build:
      context: ../..
      dockerfile: apps/grid-rules/Dockerfile
    image: voltpulse/grid-rules:dev
    container_name: vp-grid-rules
    environment:
      GRID_RULES_HEALTH_PORT: ${GRID_RULES_HEALTH_PORT:-8080}
      KAFKA_BROKERS: ${PULSE_KAFKA_BOOTSTRAP}
      GRID_RULES_KAFKA_PRODUCER_ENABLED: ${GRID_RULES_KAFKA_PRODUCER_ENABLED:-false}
      PULSE_KAFKA_BOOTSTRAP: ${PULSE_KAFKA_BOOTSTRAP}
      PULSE_FINDINGS_TOPIC: ${PULSE_FINDINGS_TOPIC}
      PULSE_ALERTS_TOPIC: ${PULSE_ALERTS_TOPIC}
    depends_on:
      pulse-bus:
        condition: service_healthy
    restart: "no"

  pulse-postgres:
    profiles: [data]
    image: postgres:16-alpine
    container_name: vp-pulse-postgres
    environment:
      POSTGRES_USER: ${PULSE_PG_USER}
      POSTGRES_PASSWORD: ${PULSE_PG_PASSWORD}
      POSTGRES_DB: ${PULSE_PG_DB}
    ports:
      - "${PULSE_PG_PORT:-5432}:5432"
    volumes:
      - pulse_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: "no"

  pulse-api:
    profiles: [data]
    build:
      context: ../..
      dockerfile: apps/pulse-api/Dockerfile
    image: voltpulse/pulse-api:dev
    container_name: vp-pulse-api
    ports:
      - "${PULSE_API_PORT:-3000}:${PULSE_API_PORT:-3000}"
    environment:
      PULSE_API_PORT: ${PULSE_API_PORT:-3000}
      PULSE_DATABASE_URL: ${PULSE_DATABASE_URL}
      PULSE_KAFKA_BOOTSTRAP: ${PULSE_KAFKA_BOOTSTRAP}
      PULSE_KAFKA_CONSUMER_ENABLED: ${PULSE_KAFKA_CONSUMER_ENABLED:-false}
      PULSE_AUTH_ENABLED: ${PULSE_AUTH_ENABLED:-true}
      PULSE_AUTH_STUB_KEYS: ${PULSE_AUTH_STUB_KEYS:-}
    depends_on:
      pulse-postgres:
        condition: service_healthy
    restart: "no"

  pulse-web:
    profiles: [data]
    build:
      context: ../..
      dockerfile: apps/pulse-web/Dockerfile
      args:
        # Browser-facing API base (host port), baked at build time.
        PULSE_WEB_API_URL: ${PULSE_WEB_API_URL:-}
        PULSE_WEB_API_KEY: ${PULSE_WEB_API_KEY:-}
    image: voltpulse/pulse-web:dev
    container_name: vp-pulse-web
    ports:
      - "${PULSE_WEB_PORT:-5173}:${PULSE_WEB_PORT:-5173}"
    environment:
      PULSE_WEB_PORT: ${PULSE_WEB_PORT:-5173}
      PULSE_API_BASE_URL: ${PULSE_API_BASE_URL}
    restart: "no"

  pulse-notify:
    profiles: [data]
    image: alpine:3.20
    container_name: vp-pulse-notify
    command: ["sleep", "infinity"]
    environment:
      PULSE_NOTIFY_ADAPTER: ${PULSE_NOTIFY_ADAPTER:-log}
      PULSE_API_BASE_URL: ${PULSE_API_BASE_URL}
    restart: "no"

  pulse-train:
    profiles: [data]
    image: alpine:3.20
    container_name: vp-pulse-train
    command: ["sleep", "infinity"]
    environment:
      PULSE_MODELS_TOPIC: ${PULSE_MODELS_TOPIC}
      PULSE_STORE_ENDPOINT: ${PULSE_STORE_ENDPOINT}
    restart: "no"

  pulse-prometheus:
    profiles: [obs]
    image: alpine:3.20
    container_name: vp-pulse-prometheus
    command: ["sleep", "infinity"]
    ports:
      - "${PULSE_PROM_PORT:-9090}:9090"
    restart: "no"

  pulse-grafana:
    profiles: [obs]
    image: alpine:3.20
    container_name: vp-pulse-grafana
    command: ["sleep", "infinity"]
    ports:
      - "${PULSE_GRAFANA_PORT:-3001}:3000"
    restart: "no"

  # MinIO object store (architecture: pulse-store). App client: apps/pulse-store.
  pulse-store:
    profiles: [store]
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: vp-pulse-store
    command: ["server", "/data", "--address", ":9000", "--console-address", ":9001"]
    ports:
      - "${PULSE_STORE_API_PORT:-9000}:9000"
      - "${PULSE_STORE_CONSOLE_PORT:-9001}:9001"
    environment:
      # Credentials from env only — never commit real .env
      MINIO_ROOT_USER: ${PULSE_STORE_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${PULSE_STORE_SECRET_KEY}
      PULSE_STORE_ENDPOINT: ${PULSE_STORE_ENDPOINT}
      PULSE_STORE_BUCKET: ${PULSE_STORE_BUCKET}
      PULSE_STORE_BUCKETS: ${PULSE_STORE_BUCKETS}
      PULSE_STORE_REGION: ${PULSE_STORE_REGION}
    volumes:
      - pulse_store_data:/data
    # No image healthcheck: official minio binary image lacks curl/mc; buckets init retries instead.
    restart: "no"

  # One-shot bucket create from PULSE_STORE_BUCKETS (comma-separated).
  pulse-store-buckets:
    profiles: [store]
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    container_name: vp-pulse-store-buckets
    depends_on:
      pulse-store:
        condition: service_started
    environment:
      PULSE_STORE_ACCESS_KEY: ${PULSE_STORE_ACCESS_KEY}
      PULSE_STORE_SECRET_KEY: ${PULSE_STORE_SECRET_KEY}
      PULSE_STORE_BUCKETS: ${PULSE_STORE_BUCKETS}
      PULSE_STORE_REGION: ${PULSE_STORE_REGION:-us-east-1}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        echo "waiting for pulse-store MinIO…"
        i=0
        until mc alias set vp http://pulse-store:9000 "$$PULSE_STORE_ACCESS_KEY" "$$PULSE_STORE_SECRET_KEY" 2>/dev/null; do
          i=$$((i+1))
          if [ "$$i" -gt 30 ]; then
            echo "MinIO not ready after retries" >&2
            exit 1
          fi
          sleep 2
        done
        old_ifs=$$IFS
        IFS=,
        for b in $$PULSE_STORE_BUCKETS; do
          IFS=$$old_ifs
          b=$$(echo "$$b" | tr -d '[:space:]')
          [ -n "$$b" ] || continue
          mc mb --ignore-existing "vp/$$b"
          echo "bucket ready: $$b (region=$$PULSE_STORE_REGION)"
          IFS=,
        done
        IFS=$$old_ifs
        echo "pulse-store-buckets done"
    restart: "no"

volumes:
  pulse_pg_data:
  pulse_store_data:
  pulse_kafka_data:
