# VoltPulse event topic catalog (stubs)
# Brand: VoltPulse only. Prefix: vp.*
# Producers are emit ownership; Nest (pulse-api) is write authority for state.

version: 1
project: voltpulse

topics:
  - name: vp.detect.v1
    family: vp.detect.*
    producer: grid-perception
    schema_ref: events/detect/vp.detect.v1.schema.json
    notes: Frame-stop detections with evidence object refs.

  - name: vp.findings.v1
    family: vp.findings.*
    producer: grid-rules
    schema_ref: events/findings/vp.findings.v1.schema.json
    notes: Ranked findings; Nest persists authoritative rows.

  - name: vp.alerts.v1
    family: vp.alerts.*
    producer: grid-rules
    schema_ref: events/alerts/vp.alerts.v1.schema.json
    notes: Severity/SLA alert emits; Nest persists; pulse-notify delivers.

  - name: vp.labels.v1
    family: vp.labels.*
    producer: pulse-api
    schema_ref: events/labels/vp.labels.v1.schema.json
    notes: Operator labels feeding pulse-train datasets.

  - name: vp.models.v1
    family: vp.models.*
    producer: pulse-train
    schema_ref: events/models/vp.models.v1.schema.json
    notes: Model registry / perception reload signals.
